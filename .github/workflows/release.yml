name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # A re-run after a partial failure leaves the earlier draft behind, and
      # goreleaser then creates a second one. Publishing by tag name could
      # then pick the stale draft, whose assets are not the attested ones.
      # Drafts are invisible to users, so clear them first.
      - name: Delete stale draft releases for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id" |
            while read -r id; do
              echo "deleting stale draft release $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_GITHUB_TOKEN: ${{ secrets.PRIVATE_GITHUB_TOKEN }}

      # The release is still a draft here (see .goreleaser.yml). Attest the
      # exact files setup-parraform downloads, then publish.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt

      # Publish by release id, and only if the draft's assets are byte for
      # byte the files that were just attested.
      - name: Publish the attested draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [ "$(printf '%s\n' "$ids" | grep -c .)" -ne 1 ]; then
            echo "::error::expected exactly one draft release for $GITHUB_REF_NAME, found: ${ids:-none}" >&2
            exit 1
          fi

          for f in dist/*.tar.gz dist/*_checksums.txt; do
            name=$(basename "$f")
            want="sha256:$(sha256sum "$f" | awk '{print $1}')"
            got=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ids" \
              --jq ".assets[] | select(.name == \"$name\") | .digest")
            if [ "$got" != "$want" ]; then
              echo "::error::draft asset $name ($got) is not the attested file ($want)" >&2
              exit 1
            fi
          done

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ids" -F draft=false
