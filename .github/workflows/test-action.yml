name: Test setup-parraform action

on:
  push:
    branches:
      - main
    paths:
      - action.yml
      - .github/workflows/test-action.yml
  pull_request:
    paths:
      - action.yml
      - .github/workflows/test-action.yml

permissions:
  contents: read

jobs:
  pinned-version:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - uses: ./
        id: setup
        with:
          version: v0.0.1

      - shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.setup.outputs.version }}" = "v0.0.1" ]
          command -v parraform
          [ "$(command -v parraform)" = "${{ steps.setup.outputs.parraform-path }}" ]

      # v0.0.1 predates -lock-check, so this only proves the binary runs
      # and passes "version" straight through to the real terraform.
      - shell: bash
        run: parraform version

  pinned-version-without-v-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./
        id: setup
        with:
          version: "0.0.1"

      - shell: bash
        run: '[ "${{ steps.setup.outputs.version }}" = "v0.0.1" ]'

  latest-version:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./
        id: setup

      - shell: bash
        run: |
          set -euo pipefail
          [ -n "${{ steps.setup.outputs.version }}" ]
          command -v parraform

  # hashicorp/setup-terraform's terraform_wrapper defaults to true, which
  # replaces the real terraform binary on PATH with its own Node.js wrapper
  # script (still literally named "terraform"). tfbin.Resolve() just looks
  # for that name, so parraform ends up exec'ing the wrapper -- which
  # collapses "-detailed-exitcode"'s exit code 2 (changes present) down to
  # 0, since the wrapper only special-cases 0 and 2 as "success" without
  # separately preserving 2 as its own exit status. Confirmed empirically
  # against a real hashicorp/setup-terraform run before writing this
  # comment and the README warning it backs up. terraform_wrapper: false
  # (below, and in ci.yml's own integration-test job) avoids this entirely.
  detailed-exitcode-with-terraform-wrapper-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - uses: ./
        id: setup
        with:
          version: v0.1.1

      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tfdiag && cd /tmp/tfdiag
          cat > main.tf <<'EOF'
          resource "null_resource" "x" {}
          EOF
          parraform init -input=false
          set +e
          parraform plan -detailed-exitcode -input=false
          code=$?
          set -e
          [ "$code" -eq 2 ]

  unsupported-os-fails-clearly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup
        continue-on-error: true
        uses: ./
        with:
          version: v0.0.1

      - shell: pwsh
        run: |
          if ("${{ steps.setup.outcome }}" -ne "failure") {
            Write-Error "expected the action to fail on windows-latest (no prebuilt release), outcome was ${{ steps.setup.outcome }}"
            exit 1
          }
