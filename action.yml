name: Setup parraform
description: >-
  Download a parraform release and add it to PATH. Installs parraform only
  -- pair it with hashicorp/setup-terraform (or your own terraform install)
  if you also need the real terraform binary on PATH.
author: dev-shimada
branding:
  icon: download
  color: purple

inputs:
  version:
    description: >-
      parraform version to install, e.g. "v0.0.1" (the "v" prefix is
      optional). Defaults to the latest release.
    required: false
    default: latest
  github-token:
    description: >-
      Token used to query and download the release, to avoid GitHub API
      rate limits. Defaults to the workflow's own github.token.
    required: false
    default: ${{ github.token }}
  verify-attestation:
    description: >-
      Verify the downloaded archive's build provenance attestation with
      `gh attestation verify` before extracting it: it must have been built
      by this repository's release workflow from the release's own tag.
      Releases published before attestations existed (v0.1.2 and earlier)
      have none, so installing one of them requires setting this to
      `false`. Unlike the checksums file, which lives in the same (replaceable)
      release as the archive, this ties the binary to the workflow run that
      built it.
    required: false
    default: "true"
  sha256:
    description: >-
      Expected SHA-256 of the archive, in `sha256sum` format
      (`<hash>  <archive name>`, one line per archive; copy the lines you
      need from the release's `parraform_<version>_checksums.txt`). The
      archive is rejected unless its hash matches the line for its own name.
      Because the hash is stored in your own repository, it also protects
      against a swapped release asset. Requires a pinned `version`.
    required: false
    default: ""
  terraform_wrapper:
    description: >-
      Whether to install a wrapper around parraform that captures its
      stdout, stderr, and exit code as outputs named `stdout`, `stderr`,
      and `exitcode` -- named to match hashicorp/setup-terraform's own
      input of the same name, which this is the parraform-side equivalent
      of. Exit code handling mirrors it too: a real exit code of 0 or 2
      (changes present, from `-detailed-exitcode`) both make the wrapped
      call itself succeed, so a later step can branch on
      `steps.X.outputs.exitcode == '2'`. Defaults to `false`, unlike
      hashicorp/setup-terraform's own default of `true` for this input.
    required: false
    default: "false"

outputs:
  version:
    description: The parraform release tag that was installed.
    value: ${{ steps.install.outputs.version }}
  parraform-path:
    description: Absolute path to the installed parraform binary.
    value: ${{ steps.install.outputs.parraform-path }}

runs:
  using: composite
  steps:
    - name: Install parraform
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION_INPUT: ${{ inputs.version }}
        WRAPPER_INPUT: ${{ inputs.terraform_wrapper }}
        VERIFY_INPUT: ${{ inputs.verify-attestation }}
        SHA256_INPUT: ${{ inputs.sha256 }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        if [ "$WRAPPER_INPUT" != "true" ] && [ "$WRAPPER_INPUT" != "false" ]; then
          echo "::error::setup-parraform: invalid terraform_wrapper value '$WRAPPER_INPUT' (want 'true' or 'false')." >&2
          exit 1
        fi

        if [ "$VERIFY_INPUT" != "true" ] && [ "$VERIFY_INPUT" != "false" ]; then
          echo "::error::setup-parraform: invalid verify-attestation value '$VERIFY_INPUT' (want 'true' or 'false')." >&2
          exit 1
        fi

        if [ -n "$SHA256_INPUT" ] && [ "$VERSION_INPUT" = latest ]; then
          echo "::error::setup-parraform: 'sha256' needs a pinned 'version': the hash of 'latest' changes with every release." >&2
          exit 1
        fi

        case "$RUNNER_OS" in
          Linux) os=Linux ;;
          macOS) os=Darwin ;;
          *)
            echo "::error::setup-parraform: no prebuilt release exists for $RUNNER_OS (only Linux and macOS are published). Install with 'go install github.com/dev-shimada/parraform/cmd/parraform@${VERSION_INPUT}' instead." >&2
            exit 1
            ;;
        esac

        case "$RUNNER_ARCH" in
          X64) arch=x86_64 ;;
          ARM64) arch=arm64 ;;
          X86) arch=i386 ;;
          *)
            echo "::error::setup-parraform: unsupported architecture $RUNNER_ARCH." >&2
            exit 1
            ;;
        esac

        if [ "$VERSION_INPUT" = latest ]; then
          tag=$(gh release view --repo dev-shimada/parraform --json tagName -q .tagName)
        else
          case "$VERSION_INPUT" in
            v*) tag="$VERSION_INPUT" ;;
            *) tag="v$VERSION_INPUT" ;;
          esac
        fi

        install_dir="${RUNNER_TEMP}/setup-parraform"
        mkdir -p "$install_dir"

        asset="parraform_${os}_${arch}.tar.gz"
        checksums_file="parraform_${tag#v}_checksums.txt"

        gh release download "$tag" \
          --repo dev-shimada/parraform \
          --pattern "$asset" \
          --pattern "$checksums_file" \
          --dir "$install_dir" \
          --clobber

        # A plain (non "--check") hash computation, since GNU sha256sum,
        # BSD/macOS sha256sum, and Perl's shasum don't all agree on --check
        # flag support, but all print the same "<hash>  <filename>" line for
        # a bare invocation.
        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$1" | awk '{print $1}'
          else
            openssl dgst -sha256 "$1" | awk '{print $NF}'
          fi
        }

        cd "$install_dir"

        # Caller-supplied pin, checked first: it comes from the caller's
        # repository rather than from the release being installed.
        if [ -n "$SHA256_INPUT" ]; then
          pinned=$(printf '%s\n' "$SHA256_INPUT" | awk -v a="$asset" '{f=$2; sub(/^\*/, "", f); if (f == a) print tolower($1)}')
          if [ -z "$pinned" ]; then
            echo "::error::setup-parraform: 'sha256' has no line for $asset." >&2
            exit 1
          fi
          if [ "$(sha256_of "$asset")" != "$pinned" ]; then
            echo "::error::setup-parraform: $asset does not match the pinned 'sha256' (expected $pinned, got $(sha256_of "$asset"))." >&2
            exit 1
          fi
        fi

        if [ "$VERIFY_INPUT" = "true" ]; then
          if ! gh attestation verify "$asset" \
            --repo dev-shimada/parraform \
            --signer-workflow dev-shimada/parraform/.github/workflows/release.yml \
            --source-ref "refs/tags/$tag" \
            --deny-self-hosted-runners; then
            echo "::error::setup-parraform: could not verify the build provenance of $asset from $tag. Releases published before attestations existed (v0.1.2 and earlier) have none: for those, set 'verify-attestation: false'." >&2
            exit 1
          fi
        fi

        expected=$(grep " $asset\$" "$checksums_file" | awk '{print $1}')
        if [ -z "$expected" ]; then
          echo "::error::setup-parraform: $asset not listed in $checksums_file." >&2
          exit 1
        fi
        actual=$(sha256_of "$asset")
        if [ "$actual" != "$expected" ]; then
          echo "::error::setup-parraform: checksum mismatch for $asset (expected $expected, got $actual)." >&2
          exit 1
        fi

        tar -xzf "$asset"
        chmod +x parraform

        if [ "$WRAPPER_INPUT" = "true" ]; then
          mv parraform parraform-bin
          cp "$ACTION_PATH/wrapper/parraform" parraform
          chmod +x parraform
        fi

        echo "$install_dir" >> "$GITHUB_PATH"
        echo "version=$tag" >> "$GITHUB_OUTPUT"
        echo "parraform-path=$install_dir/parraform" >> "$GITHUB_OUTPUT"
